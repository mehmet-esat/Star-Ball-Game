<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D HaxBall Clone - Pro Lobby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <img id="center-logo" src="pngwing.com.png" style="display:none;">

    <div id="nickname-modal" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:998;backdrop-filter:blur(6px);">
        <div class="auth-box">
            <div class="auth-logo"></div>
            <h2 class="auth-title">Kullanıcı Adı</h2>
            <p class="auth-subtitle">Odada görünecek ismini gir.</p>
            <div class="auth-input-group">
                <label>Nickname</label>
                <input type="text" id="nickname-input" placeholder="Nickname girin..." autocomplete="off" maxlength="20">
                <div id="nickname-error" class="auth-error"></div>
            </div>
            <div class="auth-buttons">
                <button class="auth-btn-admin" onclick="handleNicknameSubmit()"> Odaya Gir</button>
            </div>
        </div>
    </div>

    <div id="auth-modal">
        <div class="auth-box">
            <div class="auth-logo"></div>
            <h2 class="auth-title">HaxBall Odasına Katıl</h2>
            <p class="auth-subtitle">Admin misin? Şifreni gir. Değilsen geç.</p>
            <div class="auth-input-group">
                <label>Admin Şifresi</label>
                <input type="password" id="auth-password" placeholder="Şifre girin..." autocomplete="off">
                <div id="auth-error" class="auth-error"></div>
            </div>
            <div class="auth-buttons">
                <button class="auth-btn-admin" onclick="handleAuthLogin()"> Admin Olarak Gir</button>
                <button class="auth-btn-skip" onclick="handleAuthSkip()">Yetkisiz Olarak Gir →</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        
        <div id="clock-display">00:00:00</div>

        <div id="credits-layer">
            <strong>PROJE VE GELİŞTİRME:</strong><br>
            ESAT FURAN, METEHAN SUSAR,
        </div>

        <div id="admin-badge" style="display:none;"> Admin</div>

        <div id="menu-btn-overlay">
            <button id="menu-btn">⚙ Menü</button>
        </div>

        <div id="ui-layer">
            <span class="team-red" id="score-red">0</span>
            <span class="timer" id="timer-display">00:00</span>
            <span class="team-blue" id="score-blue">0</span>
        </div>

        <div id="announcement-overlay">
            <div id="announcement-text"></div>
            <div id="sub-announcement"></div>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div id="chat-input-wrapper">
                <input type="text" id="chat-input" placeholder="Mesaj yaz (Numara için: /avatar 10)..." autocomplete="off" maxlength="60">
            </div>
        </div>

        <div id="setup-menu" class="visible">
            <div class="lobby-container">
                <div class="lobby-header">
                    <div class="lobby-tabs">
                        <span class="tab active">Room</span>
                    </div>
                    <div class="lobby-header-right">
                        <button class="header-btn rec-btn"> Rec</button>
                        <button class="header-btn link-btn" onclick="copyRoomLink()">🔗 Link</button>
                    </div>
                </div>
                
                <div class="lobby-main">
                    <div class="lobby-sidebar">
                        <button class="sidebar-btn admin-only-btn" id="auto-btn" onclick="autoAssignTeams()">Auto</button>
                        <button class="sidebar-btn admin-only-btn" id="lock-btn" onclick="toggleRoomLock()"> Lock</button>
                    </div>
                    
                    <div class="lobby-columns">
                        <div class="team-col">
                            <button class="col-header bg-red" onclick="joinTeam('red')">◀ Red ▶</button>
                            <ul id="list-red" class="player-list"></ul>
                        </div>
                        <div class="team-col">
                            <button class="col-header bg-gray" onclick="joinTeam('spectator')">Spectators</button>
                            <ul id="list-spectators" class="player-list"></ul>
                        </div>
                        <div class="team-col">
                            <button class="col-header bg-blue" onclick="joinTeam('blue')">◀ Blue ▶</button>
                            <ul id="list-blue" class="player-list"></ul>
                        </div>
                    </div>
                </div>
                
                <div class="lobby-footer">
                    <div class="settings-block admin-only-section" id="settings-block">
                        <div class="set-row">
                            <span>Time limit</span>
                            <input type="number" id="input-time" value="3" min="1" max="15">
                        </div>
                        <div class="set-row">
                            <span>Score limit</span>
                            <input type="number" id="input-score" value="3" min="1" max="15">
                        </div>
                    </div>
                    <button class="start-game-btn admin-only-btn" id="start-stop-btn" onclick="toggleGameState()">▶ Start game</button>
                </div>
            </div>
        </div>

        <div id="context-menu" class="context-menu">
            <div class="context-item" onclick="kickSelectedPlayer()">Ban / Kick Player</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
